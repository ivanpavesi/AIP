[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aip"
version = "0.1.0"
description = "Scuole di Psicoterapia Cognitiva — Artificial Intelligence Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "jinja2>=3.1.6,<4",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "cryptography>=44,<50",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx2>=2.13,<3", "beautifulsoup4>=4.13,<5", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/partials/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: richiede un PostgreSQL locale usa e getta"]
